[project]
name = "tiktok-scraper"
version = "0.2.0"
description = "A basic TikTok scraper to download videos and account metadata."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "curl-cffi>=0.17.0",
]

[project.scripts]
tiktok-scraper = "tiktok_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.isort]
force-single-line = true
