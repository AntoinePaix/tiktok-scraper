[project]
name = "tokscrape"
version = "0.5.0"
description = "Download TikTok videos, account metadata, comments, hashtag videos and search results."
readme = "README.md"
license = "MIT"
authors = [{ name = "Antoine Paix" }]
requires-python = ">=3.11"
# Keep the Python versions in sync with the test matrix of .github/workflows/ci.yml.
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=25.1",
    "curl-cffi>=0.17",
    "pydantic>=2.7",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
playwright = [
    "patchright>=1.64.1",
]

[project.scripts]
tokscrape = "tokscrape.cli:main"

[project.urls]
Homepage = "https://github.com/AntoinePaix/tokscrape"
Issues = "https://github.com/AntoinePaix/tokscrape/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the live tiktok.com website (run with `-m live`)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific rules
    "TID",    # flake8-tidy-imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
