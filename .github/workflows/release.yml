name: Release

# Pushing a version tag (e.g. v0.4.0) builds the package and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the release notes list the commits since the previous tag
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in pyproject.toml ($version)"
            exit 1
          fi

      - run: uv sync --locked --all-extras
      - run: uv run pytest  # offline tests only

      - run: uv build  # wheel and sdist in dist/

      - name: Write the release notes from the commits since the previous tag
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" | grep -v '^- Release ' || true
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
          --verify-tag
