name: Release

# Pushing a version tag (e.g. v0.5.0, or v0.5.0rc1 for a release candidate) builds the package, publishes it to
# PyPI and creates a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create the GitHub release
      id-token: write  # PyPI Trusted Publishing: PyPI trusts this workflow, no token stored anywhere
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the release notes list the commits since the previous tag
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in pyproject.toml ($version)"
            exit 1
          fi

      - run: uv sync --locked --all-extras
      - run: uv run pytest  # offline tests only

      - run: uv build  # wheel and sdist in dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Write the release notes from the commits since the previous tag
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" | grep -v '^- Release ' || true
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release candidates and other pre-releases (0.5.0rc1, 0.5.0b2...) are marked as such on GitHub too.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]+$ ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag $prerelease
