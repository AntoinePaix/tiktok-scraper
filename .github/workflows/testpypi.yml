name: TestPyPI

# Run by hand (Actions > TestPyPI > Run workflow) to try a PyPI upload before a real release.
# Each run uploads a unique development version, e.g. 0.5.0.dev12: TestPyPI never accepts the same version twice.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Trusted Publishing: TestPyPI trusts this workflow, no token stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Set a unique development version
        run: |
          uv version --frozen --bump minor --bump "dev=$GITHUB_RUN_NUMBER"
          echo "VERSION=$(uv version --short)" >> "$GITHUB_ENV"

      - run: uv build
      - run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

      - name: Install it back from TestPyPI and run it
        # Only tokscrape comes from TestPyPI, where anyone can upload: its dependencies come from PyPI, pinned by
        # uv.lock. The new version may take a moment to appear in the TestPyPI index.
        run: |
          uv venv /tmp/check
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements.txt > /tmp/requirements.txt
          uv pip install --python /tmp/check -r /tmp/requirements.txt
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python /tmp/check --no-deps --no-cache \
              --index-url https://test.pypi.org/simple/ "tokscrape==$VERSION"; then
              /tmp/check/bin/tokscrape --version
              exit 0
            fi
            sleep 20
          done
          echo "::error::tokscrape $VERSION didn't appear on TestPyPI"
          exit 1
